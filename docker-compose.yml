# ShowYourBrand Docker Compose Configuration
# Local development setup for the scraping service

services:
  scraper:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ShowYourBrand-scraper
    ports:
      - "8080:8080"

    # Environment file for API keys
    env_file:
      - ./server/.env

    # Volume mount for hot reload (DEVELOPMENT ONLY)
    # DO NOT use in production - remove this line for production builds
    volumes:
      - ./server/src:/app/src:ro

    # Override command for development with hot reload
    command: uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload

    # Resource limits (JRE + Chromium + 4 parallel AI workers need more resources)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Restart policy
    restart: unless-stopped
