name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: WebSite (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebSite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # This repo does not commit package-lock.json, so `npm install` is used
      # (NextAuth 4 + Next 16 require --legacy-peer-deps).
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  server:
    name: server (Python syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The processing service has only live integration tests (Docker + MongoDB +
      # real AI keys), which can't run in CI. Byte-compile the sources to catch
      # syntax errors at least.
      - name: Byte-compile sources
        run: python -m compileall -q server/src
