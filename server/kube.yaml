apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-syb
  labels:
    app: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: audit
          image: s4m0s/audit-syb:0.0.1
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: audit-syb-env
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf -H "Authorization: Bearer $PROCESSING_SERVICE_API_KEY" http://localhost:8080/health'
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -sf -H "Authorization: Bearer $PROCESSING_SERVICE_API_KEY" http://localhost:8080/health'
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: audit-syb-service
  labels:
    app: audit
spec:
  type: LoadBalancer
  selector:
    app: audit
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
